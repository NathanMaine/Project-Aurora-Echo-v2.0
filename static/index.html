<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Aurora Echo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }
        button {
            border: none;
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        #recordButton {
            background-color: #4CAF50;
        }
        #recordButton.recording {
            background-color: #e53935;
            animation: pulse 1.5s infinite;
        }
        #recordButton:disabled {
            background-color: #9ac69b;
            cursor: not-allowed;
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        #status {
            margin-top: 12px;
            font-style: italic;
            color: #444;
        }
        #timer {
            margin-top: 6px;
            font-family: monospace;
            font-size: 18px;
            color: #333;
        }
        textarea {
            width: 100%;
            min-height: 160px;
            margin-top: 12px;
        }
        #transcription {
            white-space: pre-wrap;
            min-height: 80px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-height: 300px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Project Aurora Echo</h1>
    <p>Continuous meeting capture — click <strong>Start Meeting</strong> to begin recording, transcribing, and summarising in real time.</p>
    <button id="recordButton">Start Meeting</button>
    <div id="timer"></div>
    <div id="status">Status: idle</div>

    <h2>Live Transcript</h2>
    <div id="transcription"></div>

    <h2>Summary</h2>
    <textarea id="summary" readonly></textarea>

    <h2>Action Items</h2>
    <table>
        <thead>
            <tr>
                <th>Task</th>
                <th>Assignee</th>
                <th>Due</th>
            </tr>
        </thead>
        <tbody id="actionsBody"></tbody>
    </table>

    <script>
        const recordButton = document.getElementById('recordButton');
        const statusElement = document.getElementById('status');
        const timerElement = document.getElementById('timer');
        const transcriptionElement = document.getElementById('transcription');
        const summaryElement = document.getElementById('summary');
        const actionsBody = document.getElementById('actionsBody');

        const TARGET_SAMPLE_RATE = 16000;

        let ws;
        let audioContext;
        let processorNode;
        let sourceNode;
        let mediaStream;
        let isRecording = false;
        let timerInterval;
        let recordingStartTime;

        function updateStatus(message) {
            statusElement.textContent = `Status: ${message}`;
        }

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function startTimer() {
            recordingStartTime = Date.now();
            timerElement.textContent = '00:00';
            timerInterval = setInterval(() => {
                timerElement.textContent = formatTime(Date.now() - recordingStartTime);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function ensureWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return ws;
            }
            ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => updateStatus('connected');
            ws.onclose = () => {
                updateStatus('disconnected');
                if (isRecording) {
                    stopRecording();
                }
            };
            ws.onerror = (err) => console.error('WebSocket error', err);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'status') {
                    updateStatus(data.status || 'processing');
                } else if (data.type === 'partial_transcript') {
                    transcriptionElement.textContent += `${data.text}\n`;
                    transcriptionElement.scrollTop = transcriptionElement.scrollHeight;
                } else if (data.type === 'chunk_summary') {
                    // Periodic summary update during continuous recording
                    summaryElement.value = data.summary || '';
                    mergeActions(data.actions || []);
                } else if (data.type === 'final') {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        summaryElement.value = data.summary || '';
                        mergeActions(data.actions || []);
                    }
                    recordButton.disabled = false;
                    recordButton.textContent = 'Start Meeting';
                    recordButton.classList.remove('recording');
                    if (!data.error) {
                        updateStatus('complete');
                    }
                }
            };
            return ws;
        }

        function waitForSocketOpen(socket) {
            if (socket.readyState === WebSocket.OPEN) {
                return Promise.resolve();
            }
            return new Promise((resolve, reject) => {
                const handleOpen = () => {
                    socket.removeEventListener('close', handleClose);
                    resolve();
                };
                const handleClose = () => {
                    socket.removeEventListener('open', handleOpen);
                    reject(new Error('WebSocket closed before opening'));
                };
                socket.addEventListener('open', handleOpen, { once: true });
                socket.addEventListener('close', handleClose, { once: true });
            });
        }

        function clearResults() {
            transcriptionElement.textContent = '';
            summaryElement.value = '';
            actionsBody.innerHTML = '';
        }

        function mergeActions(actions) {
            // Replace all actions with the latest set from the server
            actionsBody.innerHTML = '';
            actions.forEach((action) => {
                const row = actionsBody.insertRow();
                row.insertCell(0).textContent = action.task || '';
                row.insertCell(1).textContent = action.assignee || '';
                row.insertCell(2).textContent = action.due || '';
            });
        }

        async function startRecording() {
            const socket = ensureWebSocket();
            clearResults();
            isRecording = true;
            recordButton.textContent = 'Stop Meeting';
            recordButton.classList.add('recording');
            updateStatus('requesting microphone');

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                    },
                });

                await waitForSocketOpen(socket);

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                processorNode = audioContext.createScriptProcessor(4096, 1, 1);

                socket.send(JSON.stringify({ type: 'start', sampleRate: TARGET_SAMPLE_RATE }));
                updateStatus('recording');
                startTimer();

                processorNode.onaudioprocess = (event) => {
                    if (!isRecording) return;

                    const inputData = event.inputBuffer.getChannelData(0);
                    let pcmData;

                    if (audioContext.sampleRate !== TARGET_SAMPLE_RATE) {
                        const ratio = TARGET_SAMPLE_RATE / audioContext.sampleRate;
                        const newLength = Math.floor(inputData.length * ratio);
                        const resampled = new Float32Array(newLength);
                        for (let i = 0; i < newLength; i++) {
                            const sourceIndex = i / ratio;
                            const lowerIndex = Math.floor(sourceIndex);
                            const upperIndex = Math.min(lowerIndex + 1, inputData.length - 1);
                            const weight = sourceIndex - lowerIndex;
                            resampled[i] = inputData[lowerIndex] * (1 - weight) + inputData[upperIndex] * weight;
                        }
                        pcmData = resampled;
                    } else {
                        pcmData = inputData;
                    }

                    const int16Buffer = new Int16Array(pcmData.length);
                    for (let i = 0; i < pcmData.length; i++) {
                        const s = Math.max(-1, Math.min(1, pcmData[i]));
                        int16Buffer[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
                    }

                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(int16Buffer.buffer);
                    }
                };

                sourceNode.connect(processorNode);
                processorNode.connect(audioContext.destination);

            } catch (error) {
                console.error('Microphone error', error);
                alert('Unable to access the microphone. Please check your permissions.');
                isRecording = false;
                recordButton.textContent = 'Start Meeting';
                recordButton.classList.remove('recording');
                updateStatus('error');
            }
        }

        function stopRecording() {
            isRecording = false;
            stopTimer();

            if (processorNode && sourceNode) {
                processorNode.disconnect();
                sourceNode.disconnect();
            }
            processorNode = null;
            sourceNode = null;
            if (mediaStream) {
                mediaStream.getTracks().forEach((track) => track.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            recordButton.disabled = true;
            recordButton.textContent = 'Finalising...';
            updateStatus('finalising');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
            }
        }

        recordButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
    </script>
</body>
</html>
