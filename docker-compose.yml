version: "3.9"

services:
  reverse-proxy:
    image: traefik:v3.0
    container_name: meeting-assistant-proxy
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.watch=true"
      - "--api.insecure=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/config/traefik.yml:/etc/traefik/dynamic.yml:ro
      - ./docker/certs:/certs:ro
    depends_on:
      - api
    networks:
      - meeting-net

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: meeting-assistant-api
    env_file:
      - .env.docker
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - ORCHESTRATOR_BACKEND=docker
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
    networks:
      - meeting-net

  # vllm service replaced by Triton Inference Server with vLLM backend
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: meeting-assistant-vllm
  #   command: ["--model", "meta-llama-3-8b-instruct", "--port", "8001"]
  #   environment:
  #     - VLLM_MODEL_ID=meta-llama-3-8b-instruct
  #   ports:
  #     - "8001:8001"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             capabilities: ["gpu"]
  #   networks:
  #     - meeting-net
  #   profiles: [model]

  triton:
    image: nvcr.io/nvidia/tritonserver:24.09-py3
    container_name: meeting-assistant-triton
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=llama
    ports:
      - "8000:8000"  # HTTP
      - "8001:8001"  # gRPC
      - "8002:8002"  # metrics
    volumes:
      - ./models/triton:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
    networks:
      - meeting-net
    profiles: [model]

  prometheus:
    image: prom/prometheus:latest
    container_name: meeting-assistant-prometheus
    volumes:
      - ./docker/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - meeting-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: meeting-assistant-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "3000:3000"
    networks:
      - meeting-net
    depends_on:
      - prometheus

  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: meeting-assistant-dcgm-exporter
    ports:
      - "9400:9400"
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
    networks:
      - meeting-net

networks:
  meeting-net:
    driver: bridge
