global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "meeting-assistant"
    metrics_path: /metrics
    static_configs:
      - targets: ["meeting-assistant-api:8000"]

  - job_name: "dcgm"
    metrics_path: /metrics
    static_configs:
      - targets: ["meeting-assistant-dcgm-exporter:9400"]
